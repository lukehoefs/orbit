name: Container image

on:
  # Docs-only changes build nothing. apps/mobile is not in the image, except its package.json (bun.lock).
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!marketing/**'
      - '!.ai/**'
      - '!README.md'
      - '!**/AGENTS.md'
      - '!.github/pull_request_template.md'
      - '!.github/workflows/testflight.yml'
      - '!apps/mobile/**'
      - 'apps/mobile/package.json'
  # A pull request runs CI and builds and smoke-tests the amd64 image without pushing it.
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!marketing/**'
      - '!.ai/**'
      - '!README.md'
      - '!**/AGENTS.md'
      - '!.github/pull_request_template.md'
      - '!.github/workflows/testflight.yml'
      - '!apps/mobile/**'
      - 'apps/mobile/package.json'
  # Run by hand (Actions, Container image, Run workflow) to rebuild main without a new commit.
  workflow_dispatch:
    inputs:
      arm64:
        description: Also build linux/arm64 (pushes to main build amd64 only; the server is x86_64)
        type: boolean
        default: false
  # A published GitHub release builds both architectures and publishes the image as `<version>`,
  # `<major>.<minor>` and `latest`.
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # web, rust and e2e checks, in parallel with the image build. publish needs them.
  ci:
    uses: ./.github/workflows/ci.yml

  # `[workspace.package] version` in Cargo.toml is the Orbit version. A release tag must be `v<version>`.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
      architectures: ${{ steps.plan.outputs.architectures }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version from Cargo.toml
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(bash scripts/version.sh)
          echo "Orbit version: $version"
          if [ "$EVENT" = release ] && [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag '$TAG' does not match Cargo.toml version '$version'. Use tag 'v$version', or change the version with 'just version <new>' first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # arm64 takes ~26 min against ~18 for amd64, and the production server is x86_64, so only a release or a
      # run by hand with the arm64 box ticked builds it.
      - name: Choose architectures
        id: plan
        env:
          ARM64: ${{ github.event_name == 'release' || inputs.arm64 == true }}
        run: |
          amd64='{"architecture":"amd64","runner":"ubuntu-24.04","uname":"x86_64"}'
          arm64='{"architecture":"arm64","runner":"ubuntu-24.04-arm","uname":"aarch64"}'
          if [ "$ARM64" = true ]; then
            echo "matrix={\"include\":[$amd64,$arm64]}" >> "$GITHUB_OUTPUT"
            echo "architectures=amd64 arm64" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$amd64]}" >> "$GITHUB_OUTPUT"
            echo "architectures=amd64" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: version
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify native build host
        env:
          EXPECTED_UNAME: ${{ matrix.uname }}
        run: |
          test "$(uname -m)" = "$EXPECTED_UNAME"
          test "$(docker info --format '{{.Architecture}}')" = "$EXPECTED_UNAME"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Set image name
        id: image
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}-${ARCHITECTURE}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
      - name: Build native image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: ORBIT_BUILD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.image.outputs.name }}
          load: true
          cache-from: type=gha,scope=orbit-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=orbit-${{ matrix.architecture }}
      - name: Verify and smoke-test native image
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}-${ARCHITECTURE}"
          test "$(docker image inspect "$image" --format '{{.Architecture}}')" = "$ARCHITECTURE"
          docker run --rm "$image" --help
          bash deploy/smoke.sh "$image"
      - name: Publish architecture image
        if: github.event_name != 'pull_request'
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}-${ARCHITECTURE}"
          docker push "$image"
      # A release also gets the smoke-tested executable, so people can run Orbit without Docker.
      - name: Extract release binary
        if: github.event_name == 'release'
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          UNAME: ${{ matrix.uname }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}-${ARCHITECTURE}"
          binary="orbit-linux-$UNAME"
          container=$(docker create "$image")
          docker cp "$container:/orbit" "$binary"
          docker rm -v "$container"
          file "$binary" | tee file.txt
          grep -E 'static(-pie|ally) linked' file.txt
          grep ', stripped' file.txt
          "./$binary" --help > /dev/null
          mkdir package
          mv "$binary" package/orbit
          XZ_OPT=-9 tar -C package -cJf "$binary.tar.xz" orbit
      - name: Keep release binary for the release job
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: orbit-linux-${{ matrix.uname }}
          path: orbit-linux-${{ matrix.uname }}.tar.xz
          if-no-files-found: error
          retention-days: 1

  release-binaries:
    if: github.event_name == 'release'
    needs: [ci, version, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: orbit-linux-*
          merge-multiple: true
      - name: Attach binaries and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          files=(orbit-linux-x86_64.tar.xz orbit-linux-aarch64.tar.xz)
          sha256sum "${files[@]}" | tee SHA256SUMS
          # --clobber replaces the files when the workflow runs again for the same release.
          gh release upload "$TAG" "${files[@]}" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  # Moves :main (or the release tags) only after CI and every image job pass.
  publish:
    if: github.event_name != 'pull_request'
    needs: [ci, version, image]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish multi-platform manifest
        env:
          EVENT: ${{ github.event_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          VERSION: ${{ needs.version.outputs.version }}
          ARCHITECTURES: ${{ needs.version.outputs.architectures }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag=${GITHUB_SHA::7}
          if [ "$EVENT" = release ]; then
            tags=(--tag "$image:$VERSION")
            # a pre-release (for example 0.2.0-rc.1) gets only its exact tag
            if [ "$PRERELEASE" != true ]; then
              tags+=(--tag "$image:${VERSION%.*}" --tag "$image:latest")
            fi
          else
            tags=(--tag "$image:$tag" --tag "$image:main")
          fi
          sources=()
          for architecture in $ARCHITECTURES; do sources+=("$image:$tag-$architecture"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$image:$tag" | tee manifest.txt
          for architecture in $ARCHITECTURES; do
            grep -E "Platform:[[:space:]]+linux/$architecture" manifest.txt
          done
      # lukethomas: portal.lthops.tech runs this image (ghcr.io/lukehoefs/orbit:main) on our own Coolify.
      # With the two secrets set, a push to main deploys it; without them the image is still published
      # and the deploy is started from Coolify, so the step skips instead of failing the run.
      - name: Deploy to Coolify
        if: github.event_name != 'release'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "COOLIFY_TOKEN or COOLIFY_WEBHOOK is not set: image published, deploy it from Coolify."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_WEBHOOK"
