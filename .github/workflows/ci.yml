name: CI

# The publish gate. image.yml calls it on every pull request and push to main, so the image build runs in
# parallel and nothing is published until it (and the image smoke test) pass. The Rust tests, fmt, clippy,
# web unit tests and e2e report from checks.yml without holding up a deploy.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The web type check (tsc -b), build and lint. A type error fails here, not inside the Docker build.
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: extractions/setup-just@v3
      - run: bun install --frozen-lockfile
      - run: just version-check
      - run: bun run build
        working-directory: apps/web
      - run: bun run lint
        working-directory: apps/web
      - run: bun run test
        working-directory: packages/api
